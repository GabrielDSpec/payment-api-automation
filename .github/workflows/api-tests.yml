name: Newman Automated API Tests

on:
  push:
    branches:
      - main

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        run: |
          newman run Payment-Gateway-API.postman_collection.json \
            -e PayPal_Environment.postman_environment.json \
            --env-var "stripe_api_key=${{ secrets.STRIPE_API_KEY }}" \
            --env-var "paypal_client_id=${{ secrets.PAYPAL_CLIENT_ID }}" \
            --env-var "paypal_client_secret=${{ secrets.PAYPAL_CLIENT_SECRET }}"